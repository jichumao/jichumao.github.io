<div class="lead"><div class="panel"><h1>雾上</h1><p class="where">加州 Ridge Trailhead，2025 年 7 月</p><p>傍晚走在山脊步道上，海雾漫进脚下的山谷。</p><p class="count">7 张照片</p></div><div class="row" style="--sum:1.5000;--n:1"><a class="ph" href="../../img/004-2400.webp" style="--ar:1.5000;--c:#4f4942" data-w="2400" data-h="1600" data-srcset="../../img/004-700.webp 700w, ../../img/004-1400.webp 1400w, ../../img/004-2400.webp 2400w" data-settings="34 mm, f/8, 1/80 s, ISO 100" data-cap="加州 Ridge Trailhead"><img src="../../img/004-700.webp" srcset="../../img/004-700.webp 700w, ../../img/004-1400.webp 1400w, ../../img/004-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 100vw" width="2400" height="1600" alt="山脊上金色的草，下面是长满树林的山丘，雾海一直铺到天边。" fetchpriority="high"></a></div></div>
<div class="rows">

<div class="row" style="--sum:2.1667;--n:2"><a class="ph" href="../../img/001-2400.webp" style="--ar:0.6667;--c:#52483d" data-w="1600" data-h="2400" data-srcset="../../img/001-700.webp 467w, ../../img/001-1400.webp 933w, ../../img/001-2400.webp 1600w" data-settings="103 mm, f/8, 1/125 s, ISO 100" data-cap="加州 Ridge Trailhead"><img src="../../img/001-700.webp" srcset="../../img/001-700.webp 467w, ../../img/001-1400.webp 933w, ../../img/001-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 31vw" width="1600" height="2400" alt="一片雾前的枯草茎。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/012-2400.webp" style="--ar:1.5000;--c:#614d34" data-w="2400" data-h="1600" data-srcset="../../img/012-700.webp 700w, ../../img/012-1400.webp 1400w, ../../img/012-2400.webp 2400w" data-settings="105 mm, f/8, 1/250 s, ISO 100" data-cap="加州 Ridge Trailhead"><img src="../../img/012-700.webp" srcset="../../img/012-700.webp 700w, ../../img/012-1400.webp 1400w, ../../img/012-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 69vw" width="2400" height="1600" alt="雾上橙色的日落，左侧是一排深色的树。" loading="lazy" decoding="async"></a></div>
