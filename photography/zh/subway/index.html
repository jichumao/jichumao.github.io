<div class="lead"><div class="panel"><h1>地铁</h1><p class="where">2025 年 4 月</p><p>我在 Unreal Engine 里搭了一节地铁车厢，用佳能 5D Mark IV、50 mm 镜头加偏振镜对着 4K 显示器拍摄，再通过后期降低数码感。</p><p class="how"><a href="../../../works/virtual-subway/">制作过程</a></p><p class="count">10 张照片</p></div><div class="row" style="--sum:1.8377;--n:1"><a class="ph" href="../../img/398-2400.webp" style="--ar:1.8377;--c:#2d2d2d" data-w="2400" data-h="1306" data-srcset="../../img/398-700.webp 700w, ../../img/398-1400.webp 1400w, ../../img/398-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/4 s, ISO 160"><img src="../../img/398-700.webp" srcset="../../img/398-700.webp 700w, ../../img/398-1400.webp 1400w, ../../img/398-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 100vw" width="2400" height="1306" alt="虚拟场景中一节地铁车厢的侧面，对着显示器翻拍：车窗旁是编号 8805 和一面旗帜贴纸。" fetchpriority="high"></a></div></div>
<div class="rows">
<div class="row" style="--sum:3.6796;--n:2"><a class="ph" href="../../img/399-2400.webp" style="--ar:1.8447;--c:#303030" data-w="2400" data-h="1301" data-srcset="../../img/399-700.webp 700w, ../../img/399-1400.webp 1400w, ../../img/399-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/30 s, ISO 1250"><img src="../../img/399-700.webp" srcset="../../img/399-700.webp 700w, ../../img/399-1400.webp 1400w, ../../img/399-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1301" alt="车厢的双开门，上面贴着“Do not hold doors”的标识。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/397-2400.webp" style="--ar:1.8349;--c:#1f1f1f" data-w="2400" data-h="1308" data-srcset="../../img/397-700.webp 700w, ../../img/397-1400.webp 1400w, ../../img/397-2400.webp 2400w" data-settings="50 mm, f/1.8, 1/4 s, ISO 100"><img src="../../img/397-700.webp" srcset="../../img/397-700.webp 700w, ../../img/397-1400.webp 1400w, ../../img/397-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1308" alt="车厢的端部，有车头灯和端门。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:1.7531;--n:1"><a class="ph" href="../../img/391-2400.webp" style="--ar:1.7531;--c:#323232" data-w="2400" data-h="1369" data-srcset="../../img/391-700.webp 700w, ../../img/391-1400.webp 1400w, ../../img/391-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/60 s, ISO 100"><img src="../../img/391-700.webp" srcset="../../img/391-700.webp 700w, ../../img/391-1400.webp 1400w, ../../img/391-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 100vw" width="2400" height="1369" alt="空无一人的车厢内部，两侧是长椅。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:3.5518;--n:2"><a class="ph" href="../../img/393-2400.webp" style="--ar:1.7884;--c:#424242" data-w="2400" data-h="1342" data-srcset="../../img/393-700.webp 700w, ../../img/393-1400.webp 1400w, ../../img/393-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/90 s, ISO 2000"><img src="../../img/393-700.webp" srcset="../../img/393-700.webp 700w, ../../img/393-1400.webp 1400w, ../../img/393-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1342" alt="一扇门窗，旁边是“No exit”标识和涂鸦。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/396-2400.webp" style="--ar:1.7634;--c:#272727" data-w="2400" data-h="1361" data-srcset="../../img/396-700.webp 700w, ../../img/396-1400.webp 1400w, ../../img/396-2400.webp 2400w" data-settings="50 mm, f/1.4, 1/90 s, ISO 800"><img src="../../img/396-700.webp" srcset="../../img/396-700.webp 700w, ../../img/396-1400.webp 1400w, ../../img/396-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1361" alt="车厢尽头的门，旁边的墙上有涂鸦。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:3.5438;--n:2"><a class="ph" href="../../img/394-2400.webp" style="--ar:1.7647;--c:#2d2d2d" data-w="2400" data-h="1360" data-srcset="../../img/394-700.webp 700w, ../../img/394-1400.webp 1400w, ../../img/394-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/90 s, ISO 1000"><img src="../../img/394-700.webp" srcset="../../img/394-700.webp 700w, ../../img/394-1400.webp 1400w, ../../img/394-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1360" alt="隔着过道看到的一张长椅和一幅装框的海报。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/392-2400.webp" style="--ar:1.7791;--c:#222222" data-w="2400" data-h="1349" data-srcset="../../img/392-700.webp 700w, ../../img/392-1400.webp 1400w, ../../img/392-2400.webp 2400w" data-settings="50 mm, f/1.4, 1/90 s, ISO 800"><img src="../../img/392-700.webp" srcset="../../img/392-700.webp 700w, ../../img/392-1400.webp 1400w, ../../img/392-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1349" alt="贴着地板看过去的过道。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:3.5837;--n:2"><a class="ph" href="../../img/395-2400.webp" style="--ar:1.7751;--c:#2e2e2e" data-w="2400" data-h="1352" data-srcset="../../img/395-700.webp 700w, ../../img/395-1400.webp 1400w, ../../img/395-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/90 s, ISO 640"><img src="../../img/395-700.webp" srcset="../../img/395-700.webp 700w, ../../img/395-1400.webp 1400w, ../../img/395-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1352" alt="顶灯和广告在车窗里模糊成一片倒影。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/400-2400.webp" style="--ar:1.8086;--c:#2a2a2a" data-w="2400" data-h="1327" data-srcset="../../img/400-700.webp 700w, ../../img/400-1400.webp 1400w, ../../img/400-2400.webp 2400w" data-settings="50 mm, f/1.2, 1/60 s, ISO 100"><img src="../../img/400-700.webp" srcset="../../img/400-700.webp 700w, ../../img/400-1400.webp 1400w, ../../img/400-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1327" alt="透过车窗看进车厢；座位上方的标牌写着“Emergency”。" loading="lazy" decoding="async"></a></div>
