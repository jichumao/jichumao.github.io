<div class="lead"><div class="panel"><h1>傍晚散步</h1><p class="where">浙江衢州府山公园，2025 年 5 月</p><p>在公园里拍的人像，从最后一点天光拍到路灯亮起。</p><p class="count">6 张照片</p></div><div class="row" style="--sum:2.0000;--n:3"><a class="ph" href="../../img/043-2400.webp" style="--ar:0.6667;--c:#28352a" data-w="1600" data-h="2400" data-srcset="../../img/043-700.webp 467w, ../../img/043-1400.webp 933w, ../../img/043-2400.webp 1600w" data-settings="85 mm, f/1.8, 1/160 s, ISO 800" data-cap="浙江衢州府山公园"><img src="../../img/043-700.webp" srcset="../../img/043-700.webp 467w, ../../img/043-1400.webp 933w, ../../img/043-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="一位戴灰色鸭舌帽、穿无袖上衣的女子站在草坪上看向镜头，树后有一座塔。" fetchpriority="high"></a><a class="ph" href="../../img/038-2400.webp" style="--ar:0.6667;--c:#333e36" data-w="1600" data-h="2400" data-srcset="../../img/038-700.webp 467w, ../../img/038-1400.webp 933w, ../../img/038-2400.webp 1600w" data-settings="85 mm, f/1.8, 1/250 s, ISO 800" data-cap="浙江衢州府山公园"><img src="../../img/038-700.webp" srcset="../../img/038-700.webp 467w, ../../img/038-1400.webp 933w, ../../img/038-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="侧脸近景：帽檐遮住了她的眼睛。" fetchpriority="high"></a><a class="ph" href="../../img/040-2400.webp" style="--ar:0.6667;--c:#212c24" data-w="1600" data-h="2400" data-srcset="../../img/040-700.webp 467w, ../../img/040-1400.webp 933w, ../../img/040-2400.webp 1600w" data-settings="85 mm, f/1.8, 1/250 s, ISO 800" data-cap="浙江衢州府山公园"><img src="../../img/040-700.webp" srcset="../../img/040-700.webp 467w, ../../img/040-1400.webp 933w, ../../img/040-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="从背后看，她仰着头，闭着眼。" fetchpriority="high"></a></div></div>

<div class="row" style="--sum:2.0000;--n:3"><a class="ph" href="../../img/046-2400.webp" style="--ar:0.6667;--c:#292e2c" data-w="1600" data-h="2400" data-srcset="../../img/046-700.webp 467w, ../../img/046-1400.webp 933w, ../../img/046-2400.webp 1600w" data-settings="85 mm, f/2, 1/30 s, ISO 640" data-cap="浙江衢州府山公园"><img src="../../img/046-700.webp" srcset="../../img/046-700.webp 467w, ../../img/046-1400.webp 933w, ../../img/046-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="她侧身坐在木长椅上，一只手臂搭在膝盖上。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/049-2400.webp" style="--ar:0.6667;--c:#2a2d2b" data-w="1600" data-h="2400" data-srcset="../../img/049-700.webp 467w, ../../img/049-1400.webp 933w, ../../img/049-2400.webp 1600w" data-settings="85 mm, f/2, 1/6 s, ISO 640" data-cap="浙江衢州府山公园"><img src="../../img/049-700.webp" srcset="../../img/049-700.webp 467w, ../../img/049-1400.webp 933w, ../../img/049-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="黄昏时她站在小路上，手握包带，看向镜头。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/051-2400.webp" style="--ar:0.6667;--c:#293732" data-w="1600" data-h="2400" data-srcset="../../img/051-700.webp 467w, ../../img/051-1400.webp 933w, ../../img/051-2400.webp 1600w" data-settings="85 mm, f/1.4, 1/40 s, ISO 6400" data-cap="浙江衢州府山公园"><img src="../../img/051-700.webp" srcset="../../img/051-700.webp 467w, ../../img/051-1400.webp 933w, ../../img/051-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 33vw" width="1600" height="2400" alt="公园的灯亮起来，她在蜿蜒的小路上回头。" loading="lazy" decoding="async"></a></div>
