<div class="lead"><div class="panel"><h1>七月四日</h1><p class="where">旧金山 Yerba Buena 岛，2025 年 7 月</p><p>从黄昏到烟花，在海湾中央看到的一晚。</p><p class="count">9 张照片</p></div><div class="row" style="--sum:2.1667;--n:2"><a class="ph" href="../../img/114-2400.webp" style="--ar:0.6667;--c:#282a2c" data-w="1600" data-h="2400" data-srcset="../../img/114-700.webp 467w, ../../img/114-1400.webp 933w, ../../img/114-2400.webp 1600w" data-settings="70 mm, f/5.6, 1/80 s, ISO 5000" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/114-700.webp" srcset="../../img/114-700.webp 467w, ../../img/114-1400.webp 933w, ../../img/114-2400.webp 1600w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 31vw" width="1600" height="2400" alt="日落时的一条堤道和一座岛，天空从橙色渐变到蓝色。" fetchpriority="high"></a><a class="ph" href="../../img/115-2400.webp" style="--ar:1.5000;--c:#222c35" data-w="2400" data-h="1600" data-srcset="../../img/115-700.webp 700w, ../../img/115-1400.webp 1400w, ../../img/115-2400.webp 2400w" data-settings="67 mm, f/5.6, 2 s, ISO 100" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/115-700.webp" srcset="../../img/115-700.webp 700w, ../../img/115-1400.webp 1400w, ../../img/115-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 69vw" width="2400" height="1600" alt="黄昏时隔着海湾看到的旧金山天际线，下方是树的剪影。" fetchpriority="high"></a></div></div>
<div class="rows">
<div class="row" style="--sum:2.3506;--n:1"><a class="ph" href="../../img/117-2400.webp" style="--ar:2.3506;--c:#0e151d" data-w="2400" data-h="1021" data-srcset="../../img/117-700.webp 700w, ../../img/117-1400.webp 1400w, ../../img/117-2400.webp 2400w" data-settings="39 mm, f/8, 13 s, ISO 100" data-cap="海湾大桥与旧金山"><img src="../../img/117-700.webp" srcset="../../img/117-700.webp 700w, ../../img/117-1400.webp 1400w, ../../img/117-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 100vw" width="2400" height="1021" alt="挂满灯的海湾大桥，通向夜晚的旧金山天际线。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:3.0000;--n:2"><a class="ph" href="../../img/116-2400.webp" style="--ar:1.5000;--c:#0c1119" data-w="2400" data-h="1600" data-srcset="../../img/116-700.webp 700w, ../../img/116-1400.webp 1400w, ../../img/116-2400.webp 2400w" data-settings="63 mm, f/8, 5 s, ISO 100" data-cap="海湾大桥东段"><img src="../../img/116-700.webp" srcset="../../img/116-700.webp 700w, ../../img/116-1400.webp 1400w, ../../img/116-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1600" alt="夜里海湾大桥的白色桥塔，路面上是车灯的光轨。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/118-2400.webp" style="--ar:1.5000;--c:#23262c" data-w="2400" data-h="1600" data-srcset="../../img/118-700.webp 700w, ../../img/118-1400.webp 1400w, ../../img/118-2400.webp 2400w" data-settings="86 mm, f/8, 13 s, ISO 100" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/118-700.webp" srcset="../../img/118-700.webp 700w, ../../img/118-1400.webp 1400w, ../../img/118-2400.webp 2400w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="2400" height="1600" alt="夜晚隔水相望的市中心天际线，灯火通明。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:2.0000;--n:2"><a class="ph" href="../../img/120-2400.webp" style="--ar:1.0000;--c:#160f0d" data-w="1347" data-h="1347" data-srcset="../../img/120-700.webp 700w, ../../img/120-2400.webp 1347w" data-settings="85 mm, f/1.4, 1/100 s, ISO 4000" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/120-700.webp" srcset="../../img/120-700.webp 700w, ../../img/120-2400.webp 1347w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="1347" height="1347" alt="金色的烟花在海湾上空绽开，下面是红色的烟。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/122-2400.webp" style="--ar:1.0000;--c:#030406" data-w="1377" data-h="1377" data-srcset="../../img/122-700.webp 700w, ../../img/122-2400.webp 1377w" data-settings="85 mm, f/1.4, 1/160 s, ISO 4000" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/122-700.webp" srcset="../../img/122-700.webp 700w, ../../img/122-2400.webp 1377w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="1377" height="1377" alt="暗色水面上方的两朵蓝色烟花。" loading="lazy" decoding="async"></a></div>
<div class="row" style="--sum:2.0000;--n:2"><a class="ph" href="../../img/126-2400.webp" style="--ar:1.0000;--c:#0d0908" data-w="1267" data-h="1267" data-srcset="../../img/126-700.webp 700w, ../../img/126-2400.webp 1267w" data-settings="85 mm, f/1.4, 1/250 s, ISO 1000" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/126-700.webp" srcset="../../img/126-700.webp 700w, ../../img/126-2400.webp 1267w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="1267" height="1267" alt="一朵巨大的金色烟花，下面还有几朵小的。" loading="lazy" decoding="async"></a><a class="ph" href="../../img/124-2400.webp" style="--ar:1.0000;--c:#080404" data-w="1298" data-h="1298" data-srcset="../../img/124-700.webp 700w, ../../img/124-2400.webp 1298w" data-settings="85 mm, f/1.4, 1/50 s, ISO 1000" data-cap="旧金山 Yerba Buena 岛"><img src="../../img/124-700.webp" srcset="../../img/124-700.webp 700w, ../../img/124-2400.webp 1298w" sizes="(max-width: 760px) and (orientation: portrait) 100vw, 50vw" width="1298" height="1298" alt="拖着长长火星的红色烟花。" loading="lazy" decoding="async"></a></div>
